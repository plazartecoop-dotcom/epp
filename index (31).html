<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrega de EPP — Cooperativa Agropecuaria de Tandil</title>

<!-- Firebase (mismo proyecto que Horas Extras / Planilla de Viajes) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap');
:root{
  --bg:#101a23; --panel:#17232e; --panel-2:#1e2c38; --line:#2b3b48; --text:#e9eef1; --muted:#8fa5b3;
  --acc:#e8a33d; --acc-dim:#4a3a1e; --green:#4fae8c; --green-dim:#17352c; --red:#d9634f; --red-dim:#3a1f1c; --blue:#5b8dbf;
}
body[data-planta="aceitera"]{
  --bg:#0f1a12; --panel:#16241a; --panel-2:#1c2f21; --line:#2a3f2c; --text:#e9f1ea; --muted:#8fae8f;
  --acc:#8fc23c; --acc-dim:#22331a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;transition:background .3s}
.wrap{max-width:980px;margin:0 auto;padding:22px 16px 90px}
h1,h2,h3{margin:0}
.mono{font-family:'JetBrains Mono',monospace}
.brand{text-align:center;margin-bottom:18px}
.brand .sub{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.4px}
.brand .title{font-size:22px;font-weight:700;margin-top:4px}
.brand .pl{font-size:13px;color:var(--acc);margin-top:4px;font-family:'JetBrains Mono',monospace}
.switch{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
.switch button{flex:0 1 200px;padding:12px;border-radius:10px;font-size:15px;font-weight:600}
.switch button.on{background:var(--acc);color:#14202b;border-color:var(--acc)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:18px;padding-bottom:4px}
.tabs button{white-space:nowrap;flex:none}
.tabs button.on{background:var(--acc-dim);color:var(--acc);border-color:var(--acc)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.card h3{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:12px;font-weight:600}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
input,select,textarea{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:9px 10px;border-radius:7px;font-size:14px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
button{background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 14px;font-size:14px;font-family:inherit;cursor:pointer}
button:hover{border-color:var(--acc)}
button.primary{background:var(--acc);color:#14202b;border-color:var(--acc);font-weight:600}
button.danger{color:var(--red);border-color:var(--red-dim)}
button.sm{padding:5px 10px;font-size:12px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:140px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:26px;font-weight:700;font-family:'JetBrains Mono',monospace;margin-top:4px}
.kpi .v.acc{color:var(--acc)}
.elems{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.elem{background:var(--panel-2);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.elem .em{font-size:24px}
.elem .n{font-size:20px;font-weight:700;font-family:'JetBrains Mono',monospace}
.elem .t{font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.li:first-of-type{border-top:none}
.li .s{color:var(--muted);font-size:12px}
.badge{font-size:11px;padding:3px 9px;border-radius:20px;white-space:nowrap;font-weight:500}
.b-warn{background:var(--acc-dim);color:var(--acc)}
.b-red{background:var(--red-dim);color:var(--red)}
.b-ok{background:var(--green-dim);color:var(--green)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:22px;border:1px solid var(--line);background:var(--panel-2);font-size:14px;cursor:pointer;user-select:none}
.chip:hover{border-color:var(--acc)}
.chip.on{background:var(--acc-dim);border-color:var(--acc);color:var(--acc)}
.chip.otro{border-style:dashed;color:var(--muted)}
.chip .q{background:var(--acc);color:#14202b;border-radius:10px;padding:0 7px;font-size:12px;font-weight:700}
.sec-t{font-size:12px;color:var(--muted);margin:12px 0 6px;display:flex;align-items:center;gap:6px}
.av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.av.big{width:58px;height:58px;font-size:20px}
.op{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.op:hover{background:var(--panel-2);border-color:var(--line)}
.op .nm{font-weight:600;font-size:15px}
.op .s{font-size:12px;color:var(--muted)}
.op .r{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sel-items .it{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.sel-items .it:first-child{border-top:none}
.step{display:flex;align-items:center;gap:6px;margin-left:auto}
.step button{width:34px;height:34px;padding:0;font-size:18px}
.step span{min-width:26px;text-align:center;font-family:'JetBrains Mono',monospace;font-weight:600}
.pad-wrap{background:#f4f1e8;border-radius:10px;position:relative;height:190px;touch-action:none}
.pad-wrap canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.pad-wrap .hint{position:absolute;bottom:34px;left:20px;right:20px;border-bottom:1px dashed #b8b2a0;pointer-events:none}
.pad-wrap .hint span{position:absolute;left:0;bottom:6px;color:#a39d8a;font-size:12px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;color:var(--muted);font-weight:500;padding:8px 6px;border-bottom:1px solid var(--line);font-size:12px;white-space:nowrap}
.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td.num,.tbl th.num{text-align:right;font-family:'JetBrains Mono',monospace}
.tscroll{overflow-x:auto}
.firma-img{height:34px;background:#f4f1e8;border-radius:5px;padding:2px 6px;display:block}
.hojas{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.hojas button.on{background:var(--acc-dim);color:var(--acc);border-color:var(--acc)}
.bar{height:22px;background:var(--panel-2);border-radius:6px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--acc);border-radius:6px}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px}
.empty .em{font-size:34px;display:block;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--green);color:#0f1a12;padding:12px 20px;border-radius:10px;font-weight:600;transition:transform .3s;z-index:60;max-width:90%}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--red);color:#fff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.show{display:flex}
.modal .card{width:100%;max-width:560px;margin:0}
.hide{display:none!important}
.back{margin-bottom:12px}
.muted{color:var(--muted)}
.small{font-size:12px}
.sub-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.sub-tabs button.on{background:var(--acc-dim);color:var(--acc);border-color:var(--acc)}
@media (max-width:560px){.kpi .v{font-size:22px}.switch button{font-size:14px;padding:10px}}
</style>
</head>
<body data-planta="balanceados">
<div class="wrap">
  <div class="brand">
    <div class="sub">Cooperativa Agropecuaria de Tandil</div>
    <div class="title">Entrega de elementos de protección personal</div>
    <div class="pl" id="pl-nombre"></div>
  </div>
  <div class="switch">
    <button data-p="balanceados" onclick="setPlanta('balanceados')">🏭 Balanceados</button>
    <button data-p="aceitera" onclick="setPlanta('aceitera')">🌻 Aceitera</button>
  </div>
  <nav class="tabs">
    <button data-t="tablero" onclick="setTab('tablero')">📊 Tablero</button>
    <button data-t="nueva" onclick="setTab('nueva')">➕ Nueva entrega</button>
    <button data-t="operarios" onclick="setTab('operarios')">👷 Operarios</button>
    <button data-t="estad" onclick="setTab('estad')">📈 Estadísticas</button>
    <button data-t="config" onclick="setTab('config')">⚙️ Configuración</button>
  </nav>

  <!-- TABLERO -->
  <section id="v-tablero"></section>

  <!-- NUEVA ENTREGA -->
  <section id="v-nueva" class="hide">
    <div class="card">
      <h3>Fecha</h3>
      <input type="date" id="ne-fecha" style="max-width:220px">
    </div>
    <div class="card">
      <h3>Operario</h3>
      <div id="ne-op-sel"></div>
      <div id="ne-op-lista">
        <input id="ne-buscar" placeholder="Buscar por nombre" oninput="renderNeOperarios()">
        <div id="ne-ops"></div>
        <div id="ne-otro-op" class="hide" style="margin-top:12px;border-top:1px solid var(--line);padding-top:12px">
          <div class="row">
            <div><label>Apellido y nombre</label><input id="ne-otro-nombre"></div>
            <div><label>Puesto / sector</label><input id="ne-otro-sector" list="dl-sectores"></div>
          </div>
          <label style="display:flex;gap:8px;align-items:center;margin-top:10px;font-size:13px;color:var(--text)"><input type="checkbox" id="ne-otro-guardar" checked style="width:auto"> Agregar a la lista de la planta</label>
          <div style="margin-top:10px;display:flex;gap:8px"><button class="primary" onclick="agregarOtroOperario()">Usar este operario</button><button onclick="toggleOtroOp(false)">Cancelar</button></div>
        </div>
      </div>
    </div>
    <div class="card">
      <h3>Elementos entregados</h3>
      <div class="sel-items" id="ne-items"></div>
      <div class="chips" id="ne-cat" style="margin-top:10px"></div>
      <div id="ne-otro-el" class="hide" style="margin-top:12px;border-top:1px solid var(--line);padding-top:12px">
        <div class="row">
          <div><label>Producto</label><input id="oe-prod"></div>
          <div><label>Tipo / modelo</label><input id="oe-tipo"></div>
        </div>
        <div class="row" style="margin-top:8px">
          <div><label>Marca</label><input id="oe-marca"></div>
          <div><label>¿Posee certificación?</label><select id="oe-cert"><option value="si">Sí</option><option value="no">No</option></select></div>
        </div>
        <label style="display:flex;gap:8px;align-items:center;margin-top:10px;font-size:13px;color:var(--text)"><input type="checkbox" id="oe-guardar" checked style="width:auto"> Agregar al listado de EPP</label>
        <div style="margin-top:10px;display:flex;gap:8px"><button class="primary" onclick="agregarOtroElemento()">Agregar</button><button onclick="toggleOtroEl(false)">Cancelar</button></div>
      </div>
    </div>
    <div class="card">
      <h3>Datos opcionales</h3>
      <div class="row">
        <div><label>Retira otra persona (nombre)</label><input id="ne-retira" placeholder="Dejar vacío si retira el mismo operario"></div>
        <div><label>Observación</label><input id="ne-obs"></div>
      </div>
    </div>
    <div class="card">
      <h3>Firma del trabajador</h3>
      <div class="pad-wrap"><canvas id="ne-pad"></canvas><div class="hint"><span>Firmar aquí con el dedo</span></div></div>
      <div style="display:flex;gap:8px;margin-top:12px;justify-content:space-between;flex-wrap:wrap">
        <button onclick="padNE.limpiar()">Borrar firma</button>
        <button class="primary" id="ne-guardar" onclick="guardarEntrega()">✔ Guardar entrega</button>
      </div>
    </div>
  </section>

  <!-- OPERARIOS -->
  <section id="v-operarios" class="hide"></section>
  <section id="v-ficha" class="hide"></section>

  <!-- ESTADÍSTICAS -->
  <section id="v-estad" class="hide"></section>

  <!-- CONFIGURACIÓN -->
  <section id="v-config" class="hide"></section>
</div>

<datalist id="dl-sectores"></datalist>

<!-- Modal de firma pendiente -->
<div class="modal" id="m-firma">
  <div class="card">
    <h3 id="mf-titulo">Firmar entrega</h3>
    <div id="mf-detalle" class="small muted" style="margin-bottom:10px"></div>
    <div class="pad-wrap"><canvas id="mf-pad"></canvas><div class="hint"><span>Firmar aquí con el dedo</span></div></div>
    <div style="display:flex;gap:8px;margin-top:12px;justify-content:space-between">
      <button onclick="padMF.limpiar()">Borrar</button>
      <div style="display:flex;gap:8px"><button onclick="cerrarModalFirma()">Cancelar</button><button class="primary" onclick="guardarFirmaPendiente()">Guardar firma</button></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   CONFIGURACIÓN
   ========================================================= */
firebase.initializeApp({ databaseURL: "https://planilla-viajes-2026-default-rtdb.firebaseio.com" });
const db = firebase.database();
const R = "epp"; // rama propia de esta app

const PLANTAS = {
  balanceados: { nombre: "Fábrica de Alimentos Balanceados", corto: "Balanceados", he: "horasExtras" },
  aceitera:    { nombre: "Aceitera Coopagro",                corto: "Aceitera",    he: "horasExtrasCoopagro" }
};
const MESES = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
const MESES_L = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const FILAS_POR_HOJA = 9;
const CAT_INICIAL = [
  ["Pantalón","grafa","Ombu","si","👖"],
  ["Remera","algodón","Genérica","no","👕"],
  ["Buzo","algodón","Klarge","no","🧥"],
  ["Botín / zapatilla","seguridad","ATT","si","🥾"],
  ["Barbijo","N95","3M","si","😷"],
  ["Guantes","moteados","Genéricos","no","🧤"],
  ["Faja","lumbar / chaleco","Ombu","si","🦺"],
  ["Protector auditivo","A300 / descartables","Libus","si","🎧"]
];
const CHART_COLORS = ["#e8a33d","#5b8dbf","#4fae8c","#d9634f","#a98bd6","#8fc23c","#d6b25b","#5fb8c2","#c97fa6","#9aa7b1"];
const AV_COLORS = [["#4a3a1e","#e8a33d"],["#1d3550","#7fb0e0"],["#17352c","#6fcca9"],["#3a1f1c","#e98a77"],["#33284a","#b9a2e6"],["#22331a","#a6d45a"]];

/* =========================================================
   ESTADO
   ========================================================= */
const D = {};
Object.keys(PLANTAS).forEach(p => D[p] = { he:{}, extras:{}, fichas:{}, entregas:{} });
let CATALOGO = {}, CONFIG = null;
let PLANTA = "balanceados";
try { PLANTA = localStorage.getItem("epp_planta") || "balanceados"; } catch(e){}
if (!PLANTAS[PLANTA]) PLANTA = "balanceados";
let TAB = "tablero";
let FICHA = null, FICHA_HOJA = null;
let NE = { persona:null, items:{} };
let ESTAD_MODO = "mes", ESTAD_ANIO = new Date().getFullYear(), TB_ANIO = new Date().getFullYear(), TB_MES = "todo";
let VER_INACTIVOS = false;
const FIRMAS = {};      // cache entregaId -> dataURL
const CHARTS = {};
let firmaPendienteId = null;

/* =========================================================
   UTILIDADES
   ========================================================= */
const $ = id => document.getElementById(id);
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function hoy(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fFecha(iso){ if(!iso) return ""; const [y,m,d]=iso.split("-"); return `${d}/${m}/${y}`; }
function fCorta(iso){ if(!iso) return ""; const [y,m,d]=iso.split("-"); return `${d}-${MESES[+m-1].toLowerCase()}`; }
function iniciales(n){ const p=String(n||"?").trim().split(/[\s,]+/).filter(Boolean); return ((p[0]||"?")[0]+((p[1]||"")[0]||"")).toUpperCase(); }
function hash(s){ let h=0; for(const c of String(s)) h=(h*31+c.charCodeAt(0))|0; return Math.abs(h); }
function avatar(n, big){ const c=AV_COLORS[hash(n)%AV_COLORS.length]; return `<div class="av ${big?'big':''}" style="background:${c[0]};color:${c[1]}">${esc(iniciales(n))}</div>`; }
function toast(msg, err){ const t=$("toast"); t.textContent=msg; t.className="toast show"+(err?" err":""); clearTimeout(t._h); t._h=setTimeout(()=>t.className="toast",2600); }
function emojiDe(prod){ const c=Object.values(CATALOGO).find(x=>x.producto===prod); return (c&&c.emoji)||"📦"; }
function catOrden(soloActivos){ return Object.entries(CATALOGO).filter(([,c])=>!soloActivos||c.activo!==false).sort((a,b)=>(a[1].orden??99)-(b[1].orden??99)||a[1].producto.localeCompare(b[1].producto)); }
function n(x){ return Number(x)||0; }

/* =========================================================
   FIREBASE: LECTURA
   ========================================================= */
let pend = null;
function refrescar(){ clearTimeout(pend); pend = setTimeout(renderActual, 60); }

Object.keys(PLANTAS).forEach(p => {
  db.ref(PLANTAS[p].he + "/personal").on("value", s => { D[p].he = s.val()||{}; refrescar(); });
  db.ref(`${R}/extras/${p}`).on("value", s => { D[p].extras = s.val()||{}; refrescar(); });
  db.ref(`${R}/fichas/${p}`).on("value", s => { D[p].fichas = s.val()||{}; refrescar(); });
  db.ref(`${R}/entregas/${p}`).on("value", s => {
    const v = s.val()||{}; Object.keys(v).forEach(k => { v[k].id = k; v[k].items = v[k].items ? Object.values(v[k].items) : []; });
    D[p].entregas = v; refrescar();
  });
});
db.ref(R + "/catalogo").on("value", s => {
  if (!s.exists()) { sembrarCatalogo(); return; }
  CATALOGO = s.val(); refrescar();
});
db.ref(R + "/config").on("value", s => {
  if (!s.exists()) { sembrarConfig(); return; }
  CONFIG = s.val(); refrescar();
});

function sembrarCatalogo(){
  const obj = {};
  CAT_INICIAL.forEach((c,i) => { obj[db.ref(R+"/catalogo").push().key] = { producto:c[0], tipo:c[1], marca:c[2], cert:c[3], emoji:c[4], orden:i, activo:true }; });
  db.ref(R+"/catalogo").set(obj);
}
function sembrarConfig(){
  db.ref(R+"/config").set({ razonSocial:"Cooperativa Agropecuaria de Tandil Ltda.", cuit:"30-50836064-5", domicilio:"", localidad:"Tandil", cp:"7000", provincia:"Buenos Aires" });
  db.ref(`${R}/extras/balanceados`).push({ apellidoNombre:"PABLO", sector:"Jefe de Producción" });
}

/* =========================================================
   DATOS DERIVADOS
   ========================================================= */
function personas(p){
  const out = {};
  Object.entries(D[p].he).forEach(([id,o]) => { const k="h_"+id; out[k] = { key:k, nombre:o.apellidoNombre||"", sector:o.sector||"", codigo:o.codigo||"", origen:"he" }; });
  Object.entries(D[p].extras).forEach(([id,o]) => { const k="x_"+id; out[k] = { key:k, nombre:o.apellidoNombre||"", sector:o.sector||"", origen:"epp" }; });
  Object.values(D[p].entregas).forEach(e => { if (e.persona && !out[e.persona]) out[e.persona] = { key:e.persona, nombre:e.nombre, sector:e.sector, origen:"baja", inactivo:true }; });
  Object.values(out).forEach(o => {
    const f = D[p].fichas[o.key] || {};
    o.dni = f.dni || ""; o.puesto = f.puesto || o.sector; o.necesarios = f.necesarios || ""; o.info = f.info || "";
    if (f.inactivo) o.inactivo = true;
  });
  return out;
}
function entregasOrden(p){ return Object.values(D[p].entregas).sort((a,b)=>a.fecha.localeCompare(b.fecha)||a.ts-b.ts); }
function entregasDe(p,key){ return entregasOrden(p).filter(e=>e.persona===key); }
function filasDe(p,key){ const r=[]; entregasDe(p,key).forEach(e=>e.items.forEach(it=>r.push({e,it}))); return r; }
function anios(p){ const s=new Set([new Date().getFullYear()]); Object.values(D[p].entregas).forEach(e=>s.add(+e.fecha.slice(0,4))); return [...s].sort((a,b)=>b-a); }
function enPeriodo(e, anio, mes){ if (+e.fecha.slice(0,4)!==+anio) return false; return mes==="todo" || +e.fecha.slice(5,7)===+mes; }
function sectoresPlanta(p){ const s=new Set(); Object.values(personas(p)).forEach(o=>o.sector&&s.add(o.sector)); return [...s].sort(); }

function alertas(p){
  const out=[], lim=Date.now()-60*864e5, acc={};
  Object.values(D[p].entregas).forEach(e => {
    if (new Date(e.fecha+"T12:00").getTime() < lim) return;
    e.items.forEach(it => { const k=e.persona+"|"+it.producto; acc[k]=acc[k]||{n:0,nombre:e.nombre,prod:it.producto,persona:e.persona}; acc[k].n+=n(it.cantidad); });
  });
  Object.values(acc).filter(a=>a.n>=3).forEach(a=>out.push({cls:"b-warn",txt:`${emojiDe(a.prod)} ${a.nombre} · ${a.prod}`,badge:`${a.n} en 60 días`,persona:a.persona}));
  const sf={}; Object.values(D[p].entregas).filter(e=>!e.firmada).forEach(e=>{ sf[e.persona]=sf[e.persona]||{n:0,nombre:e.nombre}; sf[e.persona].n++; });
  Object.entries(sf).forEach(([k,v])=>out.push({cls:"b-red",txt:`✍️ ${v.nombre}`,badge:v.n===1?"1 sin firma":`${v.n} sin firma`,persona:k}));
  const per=personas(p); const sinDni=Object.values(per).filter(o=>!o.dni && Object.values(D[p].entregas).some(e=>e.persona===o.key));
  sinDni.forEach(o=>out.push({cls:"b-warn",txt:`🪪 ${o.nombre}`,badge:"falta DNI",persona:o.key}));
  return out;
}

function graficoMensual(id, p, anio){
  const prods = {};
  Object.values(D[p].entregas).filter(e=>+e.fecha.slice(0,4)===+anio).forEach(e=>e.items.forEach(it=>{
    prods[it.producto]=prods[it.producto]||Array(12).fill(0); prods[it.producto][+e.fecha.slice(5,7)-1]+=n(it.cantidad);
  }));
  const ds = Object.entries(prods).map(([pr,v],i)=>({label:pr,data:v,backgroundColor:CHART_COLORS[i%CHART_COLORS.length],borderRadius:3}));
  dibujar(id,{type:"bar",data:{labels:MESES,datasets:ds},options:opcionesChart(true)});
}
function opcionesChart(stacked){
  const c = getComputedStyle(document.body), m = c.getPropertyValue("--muted").trim(), l = c.getPropertyValue("--line").trim();
  return { responsive:true, maintainAspectRatio:false,
    plugins:{ legend:{ position:"bottom", labels:{ color:m, boxWidth:10, font:{family:"Inter",size:11} } } },
    scales:{ x:{ stacked, grid:{display:false}, ticks:{color:m,font:{family:"Inter",size:11}} },
             y:{ stacked, beginAtZero:true, grid:{color:l}, ticks:{color:m,precision:0,font:{family:"JetBrains Mono",size:11}} } } };
}
function dibujar(id, cfg){ if (CHARTS[id]) CHARTS[id].destroy(); const el=$(id); if(!el) return; CHARTS[id] = new Chart(el, cfg); }

function Pad(cv){
  const ctx = cv.getContext("2d"); let dibujando=false, ult=null, ancho=0;
  this.vacio = true;
  this.ajustar = () => {
    const r = cv.getBoundingClientRect(); if (!r.width || r.width===ancho) return;
    ancho = r.width; const dpr = window.devicePixelRatio||1;
    cv.width = r.width*dpr; cv.height = r.height*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.lineWidth=2.4; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle="#14202b"; ctx.fillStyle="#14202b"; this.vacio=true;
  };
  const pos = e => { const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; };
  cv.addEventListener("pointerdown", e => { dibujando=true; ult=pos(e); cv.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.arc(ult.x,ult.y,1.2,0,7); ctx.fill(); this.vacio=false; e.preventDefault(); });
  cv.addEventListener("pointermove", e => { if(!dibujando) return; const q=pos(e); ctx.beginPath(); ctx.moveTo(ult.x,ult.y); ctx.lineTo(q.x,q.y); ctx.stroke(); ult=q; e.preventDefault(); });
  ["pointerup","pointercancel"].forEach(t=>cv.addEventListener(t,()=>dibujando=false));
  this.limpiar = () => { ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height); ctx.restore(); this.vacio=true; };
  this.png = () => { const o=document.createElement("canvas"); o.width=600; o.height=Math.round(600*cv.height/cv.width); o.getContext("2d").drawImage(cv,0,0,o.width,o.height); return o.toDataURL("image/png"); };
}

async function guardarEntrega(){
  const per = personas(PLANTA)[NE.persona];
  if (!per) return toast("Elegí el operario", true);
  const ids = Object.keys(NE.items).filter(k=>NE.items[k]>0 && CATALOGO[k]);
  if (!ids.length) return toast("Agregá al menos un elemento", true);
  const sinFirma = padNE.vacio;
  if (sinFirma && !confirm("La entrega no tiene firma. ¿Guardarla igual y firmarla después?")) return;
  $("ne-guardar").disabled = true;
  try {
    const ref = db.ref(`${R}/entregas/${PLANTA}`).push();
    if (!sinFirma) await db.ref(`${R}/firmas/${PLANTA}/${ref.key}`).set(padNE.png());
    await ref.set({
      persona:per.key, nombre:per.nombre, sector:per.puesto||per.sector, fecha:$("ne-fecha").value||hoy(), ts:Date.now(),
      items: ids.map(k=>{ const c=CATALOGO[k]; return { catId:k, producto:c.producto, tipo:c.tipo||"", marca:c.marca||"", cert:c.cert||"no", cantidad:NE.items[k] }; }),
      firmada:!sinFirma, retira:$("ne-retira").value.trim(), obs:$("ne-obs").value.trim()
    });
    toast(`Entrega guardada · ${per.nombre}`);
    NE = { persona:null, items:{} }; $("ne-retira").value=""; $("ne-obs").value=""; $("ne-buscar").value=""; padNE.limpiar();
    renderNueva();
  } catch(e){ toast("No se pudo guardar. Revisá la conexión.", true); }
  $("ne-guardar").disabled = false;
}

function guardarFicha(key, campo, valor){ db.ref(`${R}/fichas/${PLANTA}/${key}/${campo}`).set(valor===""?null:valor).then(()=>toast("Guardado")); }
function borrarEntrega(id){
  const e = D[PLANTA].entregas[id]; if (!e) return;
  const det = e.items.map(it=>`${it.cantidad} ${it.producto}`).join(", ");
  if (!confirm(`¿Borrar la entrega del ${fFecha(e.fecha)} (${det})?\nSe borran todos sus renglones y la firma.`)) return;
  db.ref(`${R}/firmas/${PLANTA}/${id}`).remove(); db.ref(`${R}/entregas/${PLANTA}/${id}`).remove().then(()=>toast("Entrega borrada"));
}
function abrirModalFirma(id){
  const e = D[PLANTA].entregas[id]; if (!e) return; firmaPendienteId = id;
  $("mf-titulo").textContent = "Firma de " + e.nombre;
  $("mf-detalle").textContent = fFecha(e.fecha) + " · " + e.items.map(it=>`${it.cantidad} ${it.producto}`).join(", ");
  $("m-firma").classList.add("show"); requestAnimationFrame(()=>{ padMF.ajustar(); padMF.limpiar(); });
}
function cerrarModalFirma(){ $("m-firma").classList.remove("show"); firmaPendienteId=null; }
async function guardarFirmaPendiente(){
  if (padMF.vacio) return toast("Falta la firma", true);
  const id = firmaPendienteId, img = padMF.png();
  await db.ref(`${R}/firmas/${PLANTA}/${id}`).set(img); FIRMAS[id]=img;
  await db.ref(`${R}/entregas/${PLANTA}/${id}/firmada`).set(true);
  cerrarModalFirma(); toast("Firma guardada");
}

function docResumen(anio){
  const p = PLANTA, ents = Object.values(D[p].entregas).filter(e=>+e.fecha.slice(0,4)===+anio);
  const prods = {}, sect = {}, ops = {};
  ents.forEach(e=>e.items.forEach(it=>{ const q=n(it.cantidad), m=+e.fecha.slice(5,7)-1;
    (prods[it.producto]=prods[it.producto]||Array(12).fill(0))[m]+=q;
    sect[e.sector]=sect[e.sector]||{}; sect[e.sector][it.producto]=(sect[e.sector][it.producto]||0)+q;
    ops[e.persona]=ops[e.persona]||{nombre:e.nombre,sector:e.sector,u:0,ent:new Set()}; ops[e.persona].u+=q; ops[e.persona].ent.add(e.id); }));
  const pl = Object.keys(prods), totMes = Array(12).fill(0); pl.forEach(pr=>prods[pr].forEach((v,i)=>totMes[i]+=v));
  const tot = totMes.reduce((a,b)=>a+b,0);
  return `<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Resumen EPP ${anio}</title><style>
  body{font-family:Arial,Helvetica,sans-serif;color:#1a1a1a;max-width:900px;margin:20px auto;padding:0 16px;font-size:12px}
  h1{font-size:20px;margin:0}.s{color:#666;margin:4px 0 18px}h2{font-size:14px;margin:22px 0 8px;border-bottom:2px solid ${PLANTA==="aceitera"?"#6d9a2c":"#c98a2a"};padding-bottom:4px}
  table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:5px 6px;text-align:right}th:first-child,td:first-child{text-align:left}th{background:#f3f3f3}
  .chips{display:flex;gap:10px;flex-wrap:wrap}.c{border:1px solid #ddd;border-radius:8px;padding:8px 12px}.c b{font-size:18px;display:block}
  tr.t td{font-weight:bold;background:#fafafa}@page{size:A4 landscape;margin:12mm}</style></head><body>
  <h1>Entrega de EPP · Resumen ${anio}</h1><div class="s">${esc(CONFIG.razonSocial)} · ${esc(PLANTAS[p].nombre)} · generado el ${fFecha(hoy())}</div>
  <div class="chips"><div class="c">Unidades<b>${tot}</b></div><div class="c">Entregas<b>${ents.length}</b></div><div class="c">Operarios<b>${Object.keys(ops).length}</b></div></div>
  <h2>Mes a mes</h2><table><tr><th>Elemento</th>${MESES.map(m=>`<th>${m}</th>`).join("")}<th>Total</th></tr>
  ${pl.map(pr=>`<tr><td>${esc(pr)}</td>${prods[pr].map(v=>`<td>${v||""}</td>`).join("")}<td><b>${prods[pr].reduce((a,b)=>a+b,0)}</b></td></tr>`).join("")}
  <tr class="t"><td>Total</td>${totMes.map(v=>`<td>${v||""}</td>`).join("")}<td>${tot}</td></tr></table>
  <h2>Por sector</h2><table><tr><th>Sector</th>${pl.map(pr=>`<th>${esc(pr)}</th>`).join("")}<th>Total</th></tr>
  ${Object.keys(sect).sort().map(s=>`<tr><td>${esc(s)}</td>${pl.map(pr=>`<td>${sect[s][pr]||""}</td>`).join("")}<td><b>${Object.values(sect[s]).reduce((a,b)=>a+b,0)}</b></td></tr>`).join("")}</table>
  <h2>Por operario</h2><table><tr><th>Operario</th><th>Sector</th><th>Entregas</th><th>Unidades</th></tr>
  ${Object.values(ops).sort((a,b)=>b.u-a.u).map(o=>`<tr><td>${esc(o.nombre)}</td><td style="text-align:left">${esc(o.sector)}</td><td>${o.ent.size}</td><td>${o.u}</td></tr>`).join("")}</table>
  </body></html>`;
}

function imprimirHTML(html){
  const w = window.open("", "_blank");
  if (!w) return toast("Permití las ventanas emergentes para imprimir", true);
  w.document.open(); w.document.write(html); w.document.close();
  setTimeout(()=>{ w.focus(); w.print(); }, 700);
}
async function compartirHTML(html, nombre){
  try {
    const zip = new JSZip(); zip.file(nombre+".html", html);
    const blob = await zip.generateAsync({type:"blob"});
    const file = new File([blob], nombre+".zip", {type:"application/zip"});
    if (navigator.canShare && navigator.canShare({files:[file]})) {
      try { await navigator.share({files:[file], title:nombre}); return; } catch(e){ if (e.name==="AbortError") return; }
    }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nombre+".zip"; a.click();
    toast("Archivo descargado");
  } catch(e){ toast("No se pudo generar el archivo", true); }
}
const nombreArchivo = s => String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9]+/g,"_").replace(/^_|_$/g,"");

function renderEstad(){
  const p = PLANTA, aniosL = anios(p);
  const ents = Object.values(D[p].entregas);
  const delAnio = ents.filter(e=>+e.fecha.slice(0,4)===+ESTAD_ANIO);
  let cuerpo = "";
  if (ESTAD_MODO==="mes"){
    const prods={}; delAnio.forEach(e=>e.items.forEach(it=>{ (prods[it.producto]=prods[it.producto]||Array(12).fill(0))[+e.fecha.slice(5,7)-1]+=n(it.cantidad); }));
    const max = Math.max(1,...Object.values(prods).flat());
    const tm = Array(12).fill(0); Object.values(prods).forEach(v=>v.forEach((x,i)=>tm[i]+=x));
    cuerpo = Object.keys(prods).length ? `<div class="card"><h3>Unidades por elemento · ${ESTAD_ANIO}</h3><div class="tscroll"><table class="tbl"><tr><th>Elemento</th>${MESES.map(m=>`<th class="num">${m}</th>`).join("")}<th class="num">Total</th></tr>
      ${Object.entries(prods).map(([pr,v])=>`<tr><td style="white-space:nowrap">${emojiDe(pr)} ${esc(pr)}</td>${v.map(x=>`<td class="num" style="${x?`background:color-mix(in srgb, var(--acc) ${Math.round(12+60*x/max)}%, transparent)`:""}">${x||"·"}</td>`).join("")}<td class="num" style="font-weight:700">${v.reduce((a,b)=>a+b,0)}</td></tr>`).join("")}
      <tr><td style="font-weight:700">Total</td>${tm.map(x=>`<td class="num" style="font-weight:700">${x||"·"}</td>`).join("")}<td class="num" style="font-weight:700;color:var(--acc)">${tm.reduce((a,b)=>a+b,0)}</td></tr></table></div></div>
      <div class="card"><h3>Gráfico mensual</h3><div style="position:relative;height:260px"><canvas id="ch-es"></canvas></div></div>` : vacioEstad();
  }
  if (ESTAD_MODO==="anio"){
    const prods={}, ys=[...aniosL].reverse();
    ents.forEach(e=>e.items.forEach(it=>{ const o=prods[it.producto]=prods[it.producto]||{}; o[e.fecha.slice(0,4)]=(o[e.fecha.slice(0,4)]||0)+n(it.cantidad); }));
    cuerpo = Object.keys(prods).length ? `<div class="card"><h3>Comparación por año</h3><div class="tscroll"><table class="tbl"><tr><th>Elemento</th>${ys.map(y=>`<th class="num">${y}</th>`).join("")}</tr>
      ${Object.entries(prods).map(([pr,o])=>`<tr><td>${emojiDe(pr)} ${esc(pr)}</td>${ys.map(y=>`<td class="num">${o[y]||"·"}</td>`).join("")}</tr>`).join("")}
      <tr><td style="font-weight:700">Total</td>${ys.map(y=>`<td class="num" style="font-weight:700;color:var(--acc)">${Object.values(prods).reduce((a,o)=>a+(o[y]||0),0)}</td>`).join("")}</tr></table></div></div>
      <div class="card"><h3>Gráfico por año</h3><div style="position:relative;height:260px"><canvas id="ch-es"></canvas></div></div>` : vacioEstad();
    if (Object.keys(prods).length) setTimeout(()=>dibujar("ch-es",{type:"bar",data:{labels:ys.map(String),datasets:Object.entries(prods).map(([pr,o],i)=>({label:pr,data:ys.map(y=>o[y]||0),backgroundColor:CHART_COLORS[i%CHART_COLORS.length],borderRadius:3}))},options:opcionesChart(true)}));
  }
  if (ESTAD_MODO==="sector"){
    const s={}; delAnio.forEach(e=>e.items.forEach(it=>{ const o=s[e.sector]=s[e.sector]||{t:0,p:{}}; o.t+=n(it.cantidad); o.p[it.producto]=(o.p[it.producto]||0)+n(it.cantidad); }));
    const max=Math.max(1,...Object.values(s).map(o=>o.t));
    cuerpo = Object.keys(s).length ? `<div class="card"><h3>Unidades por sector · ${ESTAD_ANIO}</h3>${Object.entries(s).sort((a,b)=>b[1].t-a[1].t).map(([k,o])=>`
      <div style="margin:12px 0"><div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px"><b>${esc(k)}</b><span class="mono">${o.t}</span></div>
      <div class="bar"><i style="width:${Math.round(100*o.t/max)}%"></i></div>
      <div class="small muted" style="margin-top:5px">${Object.entries(o.p).sort((a,b)=>b[1]-a[1]).map(([pr,q])=>`${emojiDe(pr)} ${esc(pr)} ${q}`).join(" &nbsp; ")}</div></div>`).join("")}</div>` : vacioEstad();
  }
  if (ESTAD_MODO==="operario"){
    const o={}; delAnio.forEach(e=>{ const x=o[e.persona]=o[e.persona]||{nombre:e.nombre,sector:e.sector,u:0,ent:0,p:{}}; x.ent++; e.items.forEach(it=>{ x.u+=n(it.cantidad); x.p[it.producto]=(x.p[it.producto]||0)+n(it.cantidad); }); });

      <span style="flex:1"></span>
      <button onclick="imprimirHTML(docResumen(${ESTAD_ANIO}))">🖨️ Imprimir resumen ${ESTAD_ANIO}</button>
      <button onclick="compartirHTML(docResumen(${ESTAD_ANIO}),'Resumen_EPP_${PLANTAS[PLANTA].corto}_${ESTAD_ANIO}')">📤 Compartir</button>
    </div>${cuerpo}`;
  if (ESTAD_MODO==="mes" && delAnio.length) graficoMensual("ch-es", p, ESTAD_ANIO);
}

    <div class="card"><h3>Listado de EPP</h3>
      <div class="tscroll"><table class="tbl"><tr><th></th><th>Producto</th><th>Tipo / modelo</th><th>Marca</th><th>Cert.</th><th></th></tr>
      ${catOrden(false).map(([k,c])=>`<tr style="${c.activo===false?"opacity:.5":""}">
        <td><input value="${esc(c.emoji||"📦")}" style="width:46px;text-align:center;padding:6px" onchange="editCat('${k}','emoji',this.value)"></td>
        <td><input value="${esc(c.producto)}" onchange="editCat('${k}','producto',this.value)"></td>
        <td><input value="${esc(c.tipo)}" onchange="editCat('${k}','tipo',this.value)"></td>
        <td><input value="${esc(c.marca)}" onchange="editCat('${k}','marca',this.value)"></td>
        <td><select style="width:70px" onchange="editCat('${k}','cert',this.value)"><option value="si" ${c.cert==="si"?"selected":""}>Sí</option><option value="no" ${c.cert!=="si"?"selected":""}>No</option></select></td>
        <td><button class="sm ${c.activo===false?"":"danger"}" onclick="editCat('${k}','activo',${c.activo===false})">${c.activo===false?"Activar":"Dar de baja"}</button></td></tr>`).join("")}
      </table></div>
      <div class="row" style="margin-top:12px;align-items:flex-end">
        <div><label>Nuevo producto</label><input id="nc-prod" placeholder="Casco"></div><div><label>Tipo / modelo</label><input id="nc-tipo"></div>
        <div><label>Marca</label><input id="nc-marca"></div>
        <div style="flex:0 0 90px;min-width:90px"><label>Cert.</label><select id="nc-cert"><option value="si">Sí</option><option value="no">No</option></select></div>
        <button class="primary" style="flex:0 0 auto" onclick="nuevoCat()">＋ Agregar</button>
      </div>
      <p class="small muted" style="margin-bottom:0">Los cambios de marca o modelo valen para las entregas nuevas; lo ya entregado conserva sus datos.</p>
    </div>
    <div class="card"><h3>Personas cargadas solo en EPP · ${PLANTAS[PLANTA].corto}</h3>
      ${ex.length?ex.map(([id,o])=>{ const k="x_"+id, inac=fi[k]&&fi[k].inactivo; return `<div class="li"><span>${esc(o.apellidoNombre)} <span class="s">· ${esc(o.sector)}</span>${inac?' <span class="badge b-red">inactivo</span>':""}</span>
        <span style="display:flex;gap:6px"><button class="sm" onclick="editExtra('${id}')">Editar</button><button class="sm" onclick="abrirFicha('${k}')">Ficha</button></span></div>`; }).join(""):`<div class="small muted">No hay personas extra en esta planta.</div>`}
      <div class="row" style="margin-top:12px;align-items:flex-end">
        <div><label>Apellido y nombre</label><input id="nx-nombre"></div><div><label>Puesto / sector</label><input id="nx-sector" list="dl-sectores"></div>
        <button class="primary" style="flex:0 0 auto" onclick="nuevoExtra()">＋ Agregar</button>
      </div>
      <p class="small muted" style="margin-bottom:0">Los operarios de Horas Extras se administran desde esa app. Para dar de baja a alguien, entrá a su ficha.</p>
    </div>`;
}
function editCat(k,campo,v){ db.ref(`${R}/catalogo/${k}/${campo}`).set(typeof v==="string"?v.trim():v).then(()=>toast("Guardado")); }
function nuevoCat(){
  const prod=$("nc-prod").value.trim(); if(!prod) return toast("Escribí el producto",true);
  db.ref(R+"/catalogo").push({producto:prod,tipo:$("nc-tipo").value.trim(),marca:$("nc-marca").value.trim(),cert:$("nc-cert").value,emoji:"📦",orden:99,activo:true}).then(()=>toast("Elemento agregado"));
}
function nuevoExtra(){
  const nm=$("nx-nombre").value.trim().toUpperCase(); if(!nm) return toast("Escribí el nombre",true);
  db.ref(`${R}/extras/${PLANTA}`).push({apellidoNombre:nm,sector:$("nx-sector").value.trim()||"Sin sector"}).then(()=>toast("Persona agregada"));
}
function editExtra(id){
  const o=D[PLANTA].extras[id]; const nm=prompt("Apellido y nombre:",o.apellidoNombre); if(nm===null) return;
  const sc=prompt("Puesto / sector:",o.sector); if(sc===null) return;
  db.ref(`${R}/extras/${PLANTA}/${id}`).update({apellidoNombre:nm.trim().toUpperCase(),sector:sc.trim()}).then(()=>toast("Guardado"));
}

renderActual();
</script>
</body>
</html>
